# ---------------------------------------------------------------------------
# Adds two ExternalSecrets for the marketing-analytics pieces, using the
# SAME SecretStore (vault-backend, defined once in vault-secretstore.yaml)
# and the same dns-monitoring KV mount as everything else in this
# namespace — see 08-dns-analytics-kv-and-secrets.sh for the Vault side.
# ---------------------------------------------------------------------------

# Postgres credentials for the rollup DB — consumed directly as env vars
# by postgres-rollup's StatefulSet (POSTGRES_USER/PASSWORD/DB match the
# official postgres image's expected env names exactly) and by Metabase's
# MB_DB_* env vars, and by the daily rollup CronJob.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-rollup-credentials
  namespace: dns-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgres-rollup-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres-rollup
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-rollup
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: postgres-rollup
        property: POSTGRES_DB
---
# Metabase admin bootstrap credentials. Not consumed by any container env
# var (see the note in 13-metabase.yaml on why) — tracked here purely so
# the value lives in Vault like every other secret in this stack, rather
# than in someone's password manager or a Slack message.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase-admin-credentials
  namespace: dns-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: metabase-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: METABASE_ADMIN_EMAIL
      remoteRef:
        key: metabase-admin
        property: METABASE_ADMIN_EMAIL
    - secretKey: METABASE_ADMIN_PASSWORD
      remoteRef:
        key: metabase-admin
        property: METABASE_ADMIN_PASSWORD

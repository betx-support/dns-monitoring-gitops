# values.yaml for prometheus-community/kube-prometheus-stack
# Deploy via the ArgoCD Application in argocd-application-helm.yaml, or manually:
#   helm install hq-stats prometheus-community/kube-prometheus-stack \
#     -n dns-monitoring -f values.yaml
#
# PLACEHOLDER NODE SCHEDULING: this file assumes you'll add a dedicated node
# pool for this workload, tainted so nothing else (including SnipeIT) lands
# on it by accident, and labeled so this stack's pods target it specifically.
# If you're NOT giving it dedicated nodes, delete every `tolerations:` and
# `nodeSelector:` block below and pods will schedule normally alongside
# everything else on the cluster.
#
# To create the taint/label on your new node(s) once added to the cluster:
#   kubectl taint nodes <node-name> workload=monitoring:NoSchedule
#   kubectl label nodes <node-name> workload=monitoring

# Disabled because these create Service/Endpoints objects in kube-system to
# scrape control-plane components (kube-scheduler, kube-controller-manager,
# kube-proxy, etcd) — dns-monitoring-project's AppProject only whitelists
# the dns-monitoring namespace as a destination, so ArgoCD blocks anything
# targeting kube-system. Most control-plane components also bind to
# 127.0.0.1 by default anyway, so these targets are usually unreachable
# even when permitted. Re-enable + add kube-system to the AppProject's
# destinations if you specifically want control-plane dashboards.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# kubelet monitoring is a separate toggle from the four above — it defaults
# to creating a Service/Endpoints object directly in kube-system (unlike
# the others, which just scrape existing kube-system targets). Redirected
# here instead of disabled since kubelet-level pod/container metrics are
# usually worth keeping, unlike the control-plane ones above.
kubelet:
  namespace: dns-monitoring

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 30d
    podAntiAffinity: "hard"
    podAntiAffinityTopologyKey: "kubernetes.io/hostname"

    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "monitoring"
        effect: "NoSchedule"
    nodeSelector:
      workload: monitoring

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    additionalScrapeConfigs:
      - job_name: "pihole"
        scrape_interval: 60s
        static_configs:
          - targets: ["<branch-01-ip>:9617"]
            labels: { site: "branch-01" }
#          - targets: ["<branch-02-ip>:9617"]
#            labels: { site: "branch-02" }
#          - targets: ["<branch-03-ip>:9617"]
#            labels: { site: "branch-03" }
          # ... continue for all 25 branches

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    replicas: 2
    podAntiAffinity: "hard"
    podAntiAffinityTopologyKey: "kubernetes.io/hostname"

    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "monitoring"
        effect: "NoSchedule"
    nodeSelector:
      workload: monitoring

    # Mounts the ESO-created secret at
    # /etc/alertmanager/secrets/alertmanager-slack-webhook/SLACK_WEBHOOK_URL
    # inside every Alertmanager pod, so the webhook is read from a file
    # rather than embedded in this values.yaml.
    secrets:
      - alertmanager-slack-webhook

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    route:
      receiver: "ops-team"
      group_by: ["site"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "ops-team"
        slack_configs:
          - slack_api_url_file: "/etc/alertmanager/secrets/alertmanager-slack-webhook/SLACK_WEBHOOK_URL"
            channel: "#dns-alerts"
            send_resolved: true

grafana:
  replicas: 2
  podAntiAffinity: "hard"
  podAntiAffinityTopologyKey: "kubernetes.io/hostname"

  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"
  nodeSelector:
    workload: monitoring

  persistence:
    enabled: false   # state lives in Postgres, not the pod

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  env:
    GF_DATABASE_TYPE: postgres
    GF_DATABASE_HOST: "grafana-postgres.dns-monitoring.svc.cluster.local:5432"
    GF_DATABASE_NAME: grafana
    GF_DATABASE_USER: grafana

  # Populated by the ExternalSecret in 01-external-secrets.yaml
  envFromSecret: grafana-db-credentials

  admin:
    existingSecret: "grafana-admin-credentials"   # also from ExternalSecret
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP

  # Matches the real internal-ca-issuer ClusterIssuer confirmed from
  # 03-internal-ca-clusterissuer.yaml, and the backend-protocol annotation
  # every other internal ingress (Vault UI, ArgoCD) in this cluster uses,
  # since Grafana's own Service is plain HTTP — TLS terminates at nginx.
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "internal-ca-issuer"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - dns-stats.internal.lan
    path: /
    tls:
      - secretName: dns-stats-tls
        hosts:
          - dns-stats.internal.lan

  defaultDashboardsTimezone: browser

# values.yaml for prometheus-community/kube-prometheus-stack
#
# POC MODE: scaled to single pods everywhere, and several optional
# chart components disabled, specifically to cut down object count while
# you're still validating the approach. Persistence is kept throughout —
# nothing here trades durability for object count, only redundancy.
#
# To scale back up to HA later: set replicas back to 2 on prometheus/
# alertmanager/grafana, re-add the podAntiAffinity blocks (see the HA
# guide's earlier version of this file), and reconsider re-enabling the
# components disabled below.

# CRDs are installed manually, once, via `kubectl apply --server-side`
# (see README) — ArgoCD's helm.skipCrds Application setting wasn't being
# honored for this chart's CRDs, likely because they ship as a separate
# "crds" dependency subchart rather than through Helm's top-level crds/
# folder convention that skipCrds targets. Disabling the subchart directly
# here is the more reliable stop, confirmed via the `condition:` field in
# kube-prometheus-stack's Chart.yaml.
crds:
  enabled: false

# --- Cluster-monitoring components, disabled: this stack watches 25
# external Pi-holes, not this Kubernetes cluster's own health, so these
# are pure overhead on top of what you actually need. ---
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# kube-state-metrics: one extra pod, exposes k8s object metrics you're not
# using yet. Off for POC.
kubeStateMetrics:
  enabled: false

# node-exporter: a DaemonSet — one pod PER NODE, not one total. This is
# almost certainly the single biggest contributor to "too many objects"
# if your cluster has more than a couple of nodes. Off for POC.
nodeExporter:
  enabled: false

kubelet:
  namespace: dns-monitoring

# Admission webhooks add a ValidatingWebhookConfiguration, a
# MutatingWebhookConfiguration, and one-shot Job objects that generate
# their TLS certs — useful for catching malformed PrometheusRule/
# ServiceMonitor objects before they're accepted, but it's extra moving
# parts for a POC with one person authoring the rules by hand. Re-enable
# before treating this as production.
prometheusOperator:
  admissionWebhooks:
    enabled: false
  # Same issue as Grafana's sidecars: with nothing set here, LimitRange's
  # 500m/512Mi default applies — more than the Operator itself needs.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 30d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    additionalScrapeConfigs:
      - job_name: "pihole"
        scrape_interval: 60s
        static_configs:
          - targets: ["<branch-01-ip>:9617"]
            labels: { site: "branch-01" }
#          - targets: ["<branch-02-ip>:9617"]
#            labels: { site: "branch-02" }
#          - targets: ["<branch-03-ip>:9617"]
#            labels: { site: "branch-03" }
          # ... continue for all 25 branches

    # Persistence kept — a POC still loses all history on every pod
    # restart without this, which defeats the point of testing it.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1

    secrets:
      - alertmanager-slack-webhook

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    route:
      receiver: "ops-team"
      group_by: ["site"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "ops-team"
        slack_configs:
          - slack_api_url_file: "/etc/alertmanager/secrets/alertmanager-slack-webhook/SLACK_WEBHOOK_URL"
            channel: "#dns-alerts"
            send_resolved: true

grafana:
  replicas: 1

  # Switched from the external-Postgres HA pattern to Grafana's own PVC.
  # The shared Postgres backend (postgres.yaml) existed ONLY to let 2
  # Grafana pods share state safely — with a single pod there's no state
  # to share, so a plain PVC gives you the same durability (dashboards,
  # users, sessions survive a pod restart) with an entire Deployment +
  # Service + PVC + ExternalSecret removed from the object count.
  persistence:
    enabled: true
    size: 5Gi

  # The chart does NOT apply a single shared sidecar.resources to every
  # sidecar container — dashboards/datasources each need their own nested
  # resources: block, or they silently fall through to LimitRange's default
  # (500m cpu / 512Mi memory limit each). That's what actually caused the
  # rejection: 200m (grafana) + 500m (dashboards, unset) + 500m
  # (datasources, unset) = 1200m — matching the quota error's requested
  # value exactly, despite a top-level sidecar.resources being set here.
  sidecar:
    dashboards:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    datasources:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "internal-ca-issuer"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - dns-stats.internal.lan
    path: /
    tls:
      - secretName: dns-stats-tls
        hosts:
          - dns-stats.internal.lan

  defaultDashboardsTimezone: browser

# ---------------------------------------------------------------------------
# Matches the real snipeit pattern (see vault-secretstore.yaml you provided):
# a namespace-scoped SecretStore (not cluster-scoped), one dedicated Vault
# KV mount per app, "remoteRef.key" relative to that mount (the mount path
# itself is set once in vault-secretstore.yaml, not repeated here), and
# property names matching exactly what 06-dns-monitoring-kv-and-secrets.sh
# writes into Vault.
# ---------------------------------------------------------------------------

# Shared Postgres password — used by both the Postgres container itself
# (postgres.yaml) and Grafana's GF_DATABASE_PASSWORD env var (values.yaml),
# so both target keys read the same underlying Vault value, same pattern as
# snipeit's DB_PASSWORD echoing MYSQL_PASSWORD.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: dns-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: postgres
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres
        property: POSTGRES_PASSWORD
---
# Grafana admin bootstrap login.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: dns-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin
        property: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin
        property: GRAFANA_ADMIN_PASSWORD
---
# Slack webhook for Alertmanager. Mounted as a file (see values.yaml's
# alertmanager.alertmanagerSpec.secrets + slack_api_url_file config) rather
# than interpolated into the config text, since raw Alertmanager config has
# no built-in ${VAR} templating.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
  namespace: dns-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: alertmanager
        property: ALERTMANAGER_SLACK_WEBHOOK_URL

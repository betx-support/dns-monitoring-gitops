apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-monitoring-kube-prometheus-stack
  namespace: argocd
spec:
  project: dns-monitoring-project
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 62.7.0   # pin a real chart version — check `helm search repo prometheus-community/kube-prometheus-stack --versions`
      helm:
        valueFiles:
          - $values/values.yaml
    - repoURL: https://github.com/betx-support/dns-monitoring-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dns-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
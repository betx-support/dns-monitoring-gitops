apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-monitoring-kube-prometheus-stack
  namespace: argocd
spec:
  project: dns-monitoring-project
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 62.7.0
      helm:
        skipCrds: true   # CRDs installed manually via kubectl --server-side — see README
        valueFiles:
          - $values/values.yaml
    - repoURL: https://github.com/betx-support/dns-monitoring-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dns-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Required for kube-prometheus-stack specifically: its CRDs
      # (Prometheus, Alertmanager, etc.) have OpenAPI schemas large enough
      # that client-side apply's last-applied-configuration annotation
      # exceeds Kubernetes' 262144-byte annotation limit, and the CRD
      # creation fails outright. Server-side apply uses native field
      # tracking instead of that annotation, avoiding the limit entirely.
      - ServerSideApply=true
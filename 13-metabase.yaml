# Metabase — the free, no-training-needed BI tool.
#
# UPDATED for Vault Agent Injector (replaces External Secrets Operator).
# Same pattern as postgres-rollup: serviceAccountName, pre-populate-only
# (Metabase's DB credentials are a static KV v2 value, no lease to renew),
# and the injected file sourced before the real process starts.
#
# ⚠️ UNCONFIRMED — VERIFY BEFORE APPLYING: this wraps the container's
# entrypoint to source the Vault file first, which requires knowing the
# image's actual ENTRYPOINT/CMD. The command below assumes
# metabase/metabase's official entrypoint script lives at
# /app/run_metabase.sh, which has historically been correct for this
# image family but was NOT independently confirmed against the specific
# v0.51.4 tag pinned here. Confirm before applying:
#   docker pull metabase/metabase:v0.51.4
#   docker inspect metabase/metabase:v0.51.4 --format='{{.Config.Entrypoint}} {{.Config.Cmd}}'
# If the real entrypoint differs, update the `args:` below to exec the
# correct path instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: dns-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metabase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metabase
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "dns-monitoring-eso"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-postgres-rollup: "dns-monitoring/data/postgres-rollup"
        vault.hashicorp.com/agent-inject-template-postgres-rollup: |
          {{- with secret "dns-monitoring/data/postgres-rollup" -}}
          export MB_DB_USER="{{ .Data.data.POSTGRES_USER }}"
          export MB_DB_PASS="{{ .Data.data.POSTGRES_PASSWORD }}"
          export MB_DB_DBNAME="{{ .Data.data.POSTGRES_DB }}"
          {{- end }}
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
    spec:
      serviceAccountName: dns-monitoring-eso
      containers:
        - name: metabase
          image: metabase/metabase:v0.51.4   # pin to a real current version before applying
          ports:
            - containerPort: 3000
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              . /vault/secrets/postgres-rollup
              exec /app/run_metabase.sh
          env:
            - name: MB_DB_TYPE
              value: postgres
            - name: MB_DB_HOST
              value: postgres-rollup.dns-monitoring.svc.cluster.local
            - name: MB_DB_PORT
              value: "5432"
            # MB_DB_DBNAME / MB_DB_USER / MB_DB_PASS now come from the
            # sourced Vault file above, not secretKeyRef — no k8s Secret
            # exists to reference anymore.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: dns-monitoring
  labels:
    app.kubernetes.io/name: metabase
spec:
  selector:
    app.kubernetes.io/name: metabase
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metabase
  namespace: dns-monitoring
  annotations:
    cert-manager.io/cluster-issuer: "internal-ca-issuer"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: dns-insights.internal.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metabase
                port:
                  number: 3000
  tls:
    - secretName: dns-insights-tls
      hosts:
        - dns-insights.internal.lan

# Postgres for the daily "top sites" rollup table.
#
# UPDATED for Vault Agent Injector (replaces External Secrets Operator).
# No more `envFrom: secretRef: postgres-rollup-credentials` — there is no
# k8s Secret at all anymore. Instead:
#   - `serviceAccountName: dns-monitoring-eso` — REQUIRED. Under the
#     injector, THIS POD authenticates to Vault directly using its own
#     ServiceAccount token, matched against the dns-monitoring-eso role's
#     bound_service_account_names. Without this, the pod runs as
#     `default` and the injector's Vault login fails at startup.
#   - `agent-inject-template-postgres-rollup` renders the secret as a
#     shell-sourceable file at /vault/secrets/postgres-rollup (the
#     injector's default mount path, shared into every container in the
#     pod via an emptyDir).
#   - `agent-pre-populate-only: "true"` — this is a static KV v2 secret
#     with no lease to renew, so we don't want the injector's default
#     persistent renewal sidecar (unnecessary overhead for a value that
#     never rotates on its own). This makes the injector use a one-shot
#     init container instead: writes the file once, then exits, and the
#     main container starts normally afterward.
#   - The official postgres image's own entrypoint
#     (docker-entrypoint.sh) expects POSTGRES_USER/PASSWORD/DB as real
#     process environment variables — it can't read Vault's file
#     directly. `command`/`args` below wrap it: source the injected file
#     (which sets those exact three vars via `export`), then exec the
#     image's real entrypoint.
#   - agent-limits/requests annotations keep the injector's init
#     container from silently inflating this pod's effective quota
#     charge past what's actually needed — same class of issue as the
#     Grafana k8s-sidecar default-resource problem noted in
#     values.yaml's original comments, just here it's Vault's sidecar
#     instead of Grafana's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-rollup-init
  namespace: dns-monitoring
data:
  001-schema.sql: |
    CREATE TABLE IF NOT EXISTS top_domains_daily (
      day          date        NOT NULL,
      branch       text        NOT NULL,
      domain       text        NOT NULL,
      query_count  bigint      NOT NULL,
      PRIMARY KEY (day, branch, domain)
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rollup
  namespace: dns-monitoring
  labels:
    app.kubernetes.io/name: postgres-rollup
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres-rollup
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-rollup
  namespace: dns-monitoring
spec:
  serviceName: postgres-rollup
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-rollup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-rollup
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "dns-monitoring-eso"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-postgres-rollup: "dns-monitoring/data/postgres-rollup"
        vault.hashicorp.com/agent-inject-template-postgres-rollup: |
          {{- with secret "dns-monitoring/data/postgres-rollup" -}}
          export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
          export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
          {{- end }}
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
    spec:
      serviceAccountName: dns-monitoring-eso
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              . /vault/secrets/postgres-rollup
              exec docker-entrypoint.sh postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-rollup-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

# UPDATED: Pipeline A (kube-prometheus-stack: Prometheus/Alertmanager/
# Grafana) has been removed from this namespace. The three policies that
# existed solely for it — allow-ingress-from-nginx (Grafana),
# allow-egress-dns-and-branches (Prometheus scraping branch exporters),
# and allow-egress-alertmanager-notifications (Alertmanager -> Slack) —
# are deleted below. What remains is the foundation every Pipeline B
# component still relies on: default-deny-ingress plus
# allow-intra-namespace (which is what lets the collector, Loki,
# postgres-rollup, and Metabase all reach each other without needing
# individual pairwise rules). Metabase's own dedicated ingress rule lives
# in 14-networkpolicy-analytics.yaml and is unaffected by this change.

# Default-deny ingress, then explicitly allow only what's needed. This means
# SnipeIT's pods (or anything else in another namespace) cannot reach into
# this namespace unless a rule below permits it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dns-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow pods within dns-monitoring to talk to each other freely
# (collector -> Loki, rollup Job -> Loki, rollup Job -> postgres-rollup,
# Metabase -> postgres-rollup).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: dns-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}

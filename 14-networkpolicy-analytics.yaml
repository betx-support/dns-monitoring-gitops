# Additional NetworkPolicies for the analytics pipeline.
#
# UPDATED for Vault Agent Injector: allow-egress-domain-collector is
# exhaustive by design (attaching policyTypes: [Egress] at all makes it
# so for every pod it selects) — it previously only permitted 53/80/443
# and in-namespace 3100. The injector's init container now needs to
# reach Vault itself at vault.vault.svc:8200 to authenticate and fetch
# dns-monitoring/data/pihole-api, which is a DIFFERENT namespace and
# port than anything already permitted — without this rule, the
# collector's Vault login fails outright before collect.py ever runs.
#
# postgres-rollup, loki, and metabase are unaffected — none of them has
# an Egress-type NetworkPolicy selecting them, so their egress (including
# their own injector init containers reaching Vault) remains unrestricted
# by default, same as before this change.
#
# ⚠️ VERIFY BEFORE APPLYING: the namespaceSelector below assumes Vault
# runs in a namespace literally labeled `kubernetes.io/metadata.name:
# vault` (Kubernetes sets this automatically from the namespace's own
# name on 1.21+, so this should just work if Vault's namespace is named
# "vault" — but confirm rather than assume, same caution as the
# ingress-nginx selector elsewhere in this file):
#   kubectl get ns vault --show-labels

# Metabase reachable from the ingress-nginx controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nginx-metabase
  namespace: dns-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metabase
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# Domain-collector CronJob pods: DNS resolution, reaching each Pi-hole's
# API, pushing into Loki, AND (new) reaching Vault for the injector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-domain-collector
  namespace: dns-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pihole-domain-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Loki push endpoint, in-namespace.
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3100
    # NEW: Vault, for the injector's init container to authenticate and
    # fetch dns-monitoring/data/pihole-api before collect.py runs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
# Memcached-backed caching tier — unnecessary at this query volume
# (one nightly rollup query, no interactive dashboarding against Loki
# directly) and its default sizing (8Gi allocatedMemory → ~9.8Gi
# container limit) exceeds this namespace's 2Gi-per-container LimitRange
# cap anyway. Re-enable with a much smaller allocatedMemory if query
# latency ever becomes a real problem.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
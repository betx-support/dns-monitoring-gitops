# ExternalSecret for the shared Pi-hole v6 admin password, used by the
# domain-collector CronJob to authenticate against each branch's API
# before pulling top_domains. Uses the same vault-backend SecretStore and
# dns-monitoring KV mount as everything else in this namespace — see the
# Vault-side write (vault kv put dns-monitoring/pihole-api ...) and the
# corresponding policy update (dns-monitoring-eso must include
# "dns-monitoring/data/pihole-api") that must both already be in place
# before this will sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-api-credentials
  namespace: dns-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: pihole-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: PIHOLE_API_PASSWORD
      remoteRef:
        key: pihole-api
        property: PIHOLE_API_PASSWORD

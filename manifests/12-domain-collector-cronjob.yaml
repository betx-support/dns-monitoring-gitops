# Two CronJobs implementing the collection -> rollup pipeline.
#
# UPDATED: both CronJobs now set `ttlSecondsAfterFinished: 300` on their
# jobTemplate.spec. Without this, completed Job pods stick around
# indefinitely (Kubernetes only auto-cleans them via
# successfulJobsHistoryLimit/failedJobsHistoryLimit at the CronJob level,
# which caps how many *Jobs* are kept, not how quickly). Each finished
# pod's resource *limits* still count against the namespace
# ResourceQuota until the pod is actually deleted — this is exactly what
# caused `dns-analytics-rollup-manual` to fail outright with
# "exceeded quota: dns-monitoring-quota, requested: limits.cpu=300m,
# used: limits.cpu=1800m, limited: limits.cpu=2": three completed
# pihole-domain-collector pods (100m limit each) plus the three
# long-running pods (loki 500m + metabase 500m + postgres-rollup 300m)
# had already eaten the full 2000m ceiling, with no room left for the
# rollup's 300m. `ttlSecondsAfterFinished: 300` has the Kubernetes TTL
# controller delete each pod 5 minutes after it finishes (success or
# failure), so quota is reliably freed shortly after each run instead of
# accumulating run after run.
#
# UPDATED: pihole-domain-collector's schedule changed from every 15
# minutes ("*/15 * * * *") to every 30 minutes ("*/30 * * * *"), per
# request. Combined with the dashboard's own 35-minute auto-refresh
# (set in Metabase's UI, not here — see the note at the bottom of this
# file), this keeps each dashboard refresh reliably picking up at least
# one, usually close to two, completed collection runs since the
# previous refresh — 35 > 30 leaves a comfortable margin so a refresh
# essentially never lands in the middle of a collector run and reads
# stale data.
#
# All the collect.py/rollup.py fixes from earlier iterations (v1-v6) are
# unchanged and still in effect below — this update only touches Job
# lifecycle/scheduling, not the application logic or the Vault Agent
# Injector wiring.

apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-branch-hosts
  namespace: dns-monitoring
data:
  # PLACEHOLDER — your real 25 branch IPs/hostnames, keyed by branch name.
  branches.json: |
    {
      "test": "192.168.3.12"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-domain-collector-script
  namespace: dns-monitoring
data:
  collect.py: |
    import os, json, time, urllib.request, urllib.error, urllib.parse, traceback

    BRANCHES = json.load(open("/config/branches.json"))
    LOKI_PUSH_URL = os.environ.get(
        "LOKI_PUSH_URL",
        "http://dns-monitoring-loki.dns-monitoring.svc.cluster.local.:3100/loki/api/v1/push",
    )
    PIHOLE_API_PASSWORD = os.environ["PIHOLE_API_PASSWORD"]

    def get_session_id(host):
        url = f"http://{host}/api/auth"
        body = json.dumps({"password": PIHOLE_API_PASSWORD}).encode()
        req = urllib.request.Request(
            url,
            data=body,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=10) as resp:
            data = json.load(resp)
            return data["session"]["sid"]

    def fetch_top_domains(host, sid):
        # sid is base64 and can contain +, /, = — must be percent-encoded
        # or it gets corrupted in transit, causing a 401 on this call
        # even with a valid sid.
        safe_sid = urllib.parse.quote(sid, safe="")
        url = f"http://{host}/api/stats/top_domains?count=100&sid={safe_sid}"
        with urllib.request.urlopen(url, timeout=10) as resp:
            return json.load(resp)

    def push_to_loki(branch, payload):
        # Pi-hole v6's top_domains response nests the list under
        # "domains", NOT "top_domains".
        entries = payload.get("domains", [])
        if not entries:
            return
        ts_ns = str(int(time.time() * 1e9))
        lines = [[ts_ns, json.dumps({"branch": branch, "domain": d["domain"], "count": d["count"]})] for d in entries]
        body = json.dumps({"streams": [{"stream": {"job": "pihole-domain-collector", "branch": branch}, "values": lines}]}).encode()
        req = urllib.request.Request(LOKI_PUSH_URL, data=body, headers={"Content-Type": "application/json"})
        urllib.request.urlopen(req, timeout=10)

    for branch, host in BRANCHES.items():
        try:
            sid = get_session_id(host)
            data = fetch_top_domains(host, sid)
            push_to_loki(branch, data)
            print(f"[ok] {branch}: pushed {len(data.get('domains', []))} domains")
        except Exception as e:
            print(f"[warn] {branch} ({host}) unreachable: {e}")
            traceback.print_exc()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pihole-domain-collector
  namespace: dns-monitoring
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pihole-domain-collector
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "dns-monitoring-eso"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/agent-inject-secret-pihole-api: "dns-monitoring/data/pihole-api"
            vault.hashicorp.com/agent-inject-template-pihole-api: |
              {{- with secret "dns-monitoring/data/pihole-api" -}}
              export PIHOLE_API_PASSWORD="{{ .Data.data.PIHOLE_API_PASSWORD }}"
              {{- end }}
            vault.hashicorp.com/agent-limits-cpu: "100m"
            vault.hashicorp.com/agent-limits-mem: "64Mi"
            vault.hashicorp.com/agent-requests-cpu: "50m"
            vault.hashicorp.com/agent-requests-mem: "32Mi"
        spec:
          serviceAccountName: dns-monitoring-eso
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  . /vault/secrets/pihole-api
                  exec python /scripts/collect.py
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: branches
                  mountPath: /config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: pihole-domain-collector-script
            - name: branches
              configMap:
                name: pihole-branch-hosts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-analytics-rollup-script
  namespace: dns-monitoring
data:
  rollup.py: |
    import os, json, time, urllib.request, urllib.parse
    from collections import defaultdict
    import psycopg2

    LOKI_QUERY_URL = os.environ.get(
        "LOKI_QUERY_URL",
        "http://dns-monitoring-loki.dns-monitoring.svc.cluster.local.:3100/loki/api/v1/query_range",
    )

    now = int(time.time())
    start = now - 24 * 3600
    params = urllib.parse.urlencode({
        "query": '{job="pihole-domain-collector"}',
        "start": str(start * 1_000_000_000),
        "end": str(now * 1_000_000_000),
        "limit": "5000",
    })
    with urllib.request.urlopen(f"{LOKI_QUERY_URL}?{params}", timeout=30) as resp:
        result = json.load(resp)

    totals = defaultdict(int)
    for stream in result.get("data", {}).get("result", []):
        for _, line in stream.get("values", []):
            rec = json.loads(line)
            totals[(rec["branch"], rec["domain"])] += rec["count"]

    conn = psycopg2.connect(
        host="postgres-rollup.dns-monitoring.svc.cluster.local.",
        dbname=os.environ["POSTGRES_DB"],
        user=os.environ["POSTGRES_USER"],
        password=os.environ["POSTGRES_PASSWORD"],
    )
    cur = conn.cursor()
    today = time.strftime("%Y-%m-%d")
    for (branch, domain), count in totals.items():
        cur.execute(
            """
            INSERT INTO top_domains_daily (day, branch, domain, query_count)
            VALUES (%s, %s, %s, %s)
            ON CONFLICT (day, branch, domain)
            DO UPDATE SET query_count = EXCLUDED.query_count
            """,
            (today, branch, domain, count),
        )
    conn.commit()
    print(f"[ok] wrote {len(totals)} (branch, domain) rows for {today}")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-analytics-rollup
  namespace: dns-monitoring
spec:
  schedule: "20 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dns-analytics-rollup
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "dns-monitoring-eso"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/agent-inject-secret-postgres-rollup: "dns-monitoring/data/postgres-rollup"
            vault.hashicorp.com/agent-inject-template-postgres-rollup: |
              {{- with secret "dns-monitoring/data/postgres-rollup" -}}
              export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
              export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
              export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
              {{- end }}
            vault.hashicorp.com/agent-limits-cpu: "100m"
            vault.hashicorp.com/agent-limits-mem: "64Mi"
            vault.hashicorp.com/agent-requests-cpu: "50m"
            vault.hashicorp.com/agent-requests-mem: "32Mi"
        spec:
          serviceAccountName: dns-monitoring-eso
          restartPolicy: OnFailure
          containers:
            - name: rollup
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  . /vault/secrets/postgres-rollup
                  pip install --quiet psycopg2-binary
                  exec python /scripts/rollup.py
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: dns-analytics-rollup-script

# ---------------------------------------------------------------------
# Dashboard auto-refresh (35 minutes) — set in Metabase's UI, not here.
# There is no manifest/config-file equivalent; Metabase stores this in
# its own application database as a per-dashboard setting.
#   1. Open the dashboard in Metabase.
#   2. Click the "..." (or clock) icon in the top-right of the dashboard.
#   3. Choose "Auto-refresh" and set it to 35 minutes (or the closest
#      preset — Metabase's default options are 1/5/10/15/30/60 min; if
#      exactly 35 isn't offered in your version, pick 30 rather than 60,
#      since 30 still comfortably exceeds the collector's own 30-minute
#      cadence without introducing a long stale window).
#   4. This setting lives in Metabase's own DB (the same postgres-rollup
#      instance, per 13-metabase.yaml) and will need to be re-applied if
#      Metabase is ever reinstalled from scratch (e.g. after a future
#      cluster rebuild), same as any other dashboard/question you build.
# ---------------------------------------------------------------------

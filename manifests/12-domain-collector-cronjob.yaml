# Two CronJobs implementing the collection -> rollup pipeline from the
# design discussion:
#   pihole-domain-collector — polls each Pi-hole's top_domains endpoint on
#                              a schedule, pushes raw records into Loki as
#                              log lines, tagged by branch.
#   dns-analytics-rollup    — runs once daily, reads the last 24h back out
#                              of Loki, aggregates per (branch, domain),
#                              and upserts into top_domains_daily in
#                              postgres-rollup (see 11-postgres-rollup.yaml).
#
# UPDATED (v6): fixed wrong Loki Service hostname in both collect.py's
# LOKI_PUSH_URL and rollup.py's LOKI_QUERY_URL. Both pointed at
# "loki.dns-monitoring.svc.cluster.local." — a name that never existed.
# The Loki Helm chart prefixes the Helm release name onto the chart name,
# and the release here is "dns-monitoring-loki" (per the ArgoCD
# Application), so the real Service is "dns-monitoring-loki", confirmed
# against `kubectl get svc -n dns-monitoring`. NOTE: this was a real bug
# but does NOT explain the "[warn] ... HTTP Error 401: Unauthorized"
# seen from the manual test run — that 401 can only come from Pi-hole's
# /api/auth or /api/stats/top_domains calls (Loki's push endpoint isn't
# behind Pi-hole auth), so a wrong Loki hostname would surface as a DNS
# resolution error, not a 401. The 401 is still open; see
# 15-test-collector-run.sh for how to capture the full traceback.
#
# UPDATED (v5): collector container switched from python:3.12-alpine to
# python:3.12-slim (Debian/glibc), matching the image family rollup.py
# already used successfully. No extra packages are needed for
# collect.py (stdlib urllib/json/os/time only), so this is a zero-cost
# swap. Root cause: musl libc (alpine's C library) has documented
# getaddrinfo() quirks under AI_ADDRCONFIG that can produce sporadic
# "Name does not resolve" errors even for literal IP addresses — worse,
# it also gives up early on the pod's DNS search-domain fallback chain
# for any hostname with fewer dots than ndots (default 5), where glibc
# keeps trying. Confirmed by directly reproducing collect.py's exact
# HTTP calls (including a literal-IP POST) inside a fresh
# python:3.12-alpine debug pod on the same node/network path where the
# real Job had just failed: ping, wget, and a literal-IP urllib.request
# call all succeeded standalone, meaning the underlying network was
# fine — pointing squarely at an image/libc-level resolver quirk in the
# CronJob's actual run rather than a persistent network fault.
#
# UPDATED (v4): all in-cluster FQDNs (Loki push/query URLs, the
# postgres-rollup host) now use a trailing dot, e.g.
# "loki.dns-monitoring.svc.cluster.local." instead of "...local", as a
# defensive measure against the same musl search-domain issue described
# above for any DNS *name* lookups (as opposed to literal IPs).
#
# UPDATED (v3): fixed a wrong-key bug in collect.py. Pi-hole v6's
# /api/stats/top_domains response nests the list under "domains", not
# "top_domains" — the earlier version's payload.get("top_domains", [])
# silently fell through to the [] default every single run (no error, no
# warning — just "[ok] <branch>: pushed 0 domains" forever), because dict
# .get() with a default doesn't raise on a missing key. Confirmed via a
# manual curl against a real branch: the live response is
# {"domains": [...], "total_queries": ..., "blocked_queries": ..., ...}.
# Both the push_to_loki() lookup and the [ok] log line's count were
# reading the wrong key and are now fixed to read "domains".
#
# UPDATED (v2): collect.py URL-encodes the session id (sid) before putting
# it in the top_domains query string. The sid is a base64 string that can
# contain '+', '/', '=' — left un-encoded, '+' in particular gets silently
# read as a literal space by the HTTP server, corrupting the sid and
# causing a 401 on the top_domains call even though the preceding
# /api/auth login succeeded. Pi-hole's own docs call this out explicitly:
# "your SID needs to be URL-encoded" when passed in the request URI.
#
# UPDATED (v1, carried over): collect.py authenticates against each
# Pi-hole's v6 session API (POST password -> /api/auth -> sid) before
# calling top_domains, using the shared admin password from
# pihole-api-credentials (see 15-external-secret-pihole.yaml). Each run
# re-authenticates fresh per branch rather than caching/reusing a sid
# across the 15-minute schedule — simpler, and avoids session-expiry
# handling for a job that only runs every 15 minutes anyway.
#
# BUILD-QUALITY NOTE (unchanged): rollup.py installs psycopg2-binary via
# pip at container start rather than baking a real image — acceptable for
# a POC job that runs once a day, but worth building a small dedicated
# image (or picking an existing one with it preinstalled) if this becomes
# a permanent fixture, to stop depending on PyPI being reachable every run.

apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-branch-hosts
  namespace: dns-monitoring
data:
  # PLACEHOLDER, same as values.yaml's additionalScrapeConfigs — your real
  # 25 branch IPs/hostnames, keyed by branch name. Add entries as needed.
  branches.json: |
    {
      "test": "192.168.3.12"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-domain-collector-script
  namespace: dns-monitoring
data:
  collect.py: |
    import os, json, time, urllib.request, urllib.error, urllib.parse, traceback

    BRANCHES = json.load(open("/config/branches.json"))
    LOKI_PUSH_URL = os.environ.get(
        "LOKI_PUSH_URL",
        "http://dns-monitoring-loki.dns-monitoring.svc.cluster.local.:3100/loki/api/v1/push",
    )
    PIHOLE_API_PASSWORD = os.environ["PIHOLE_API_PASSWORD"]

    def get_session_id(host):
        url = f"http://{host}/api/auth"
        body = json.dumps({"password": PIHOLE_API_PASSWORD}).encode()
        req = urllib.request.Request(
            url,
            data=body,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=10) as resp:
            data = json.load(resp)
            return data["session"]["sid"]

    def fetch_top_domains(host, sid):
        # sid is base64 and can contain +, /, = — must be percent-encoded
        # or it gets corrupted in transit (e.g. '+' silently becomes a
        # space), which causes a 401 on this call even with a valid sid.
        safe_sid = urllib.parse.quote(sid, safe="")
        url = f"http://{host}/api/stats/top_domains?count=100&sid={safe_sid}"
        with urllib.request.urlopen(url, timeout=10) as resp:
            return json.load(resp)

    def push_to_loki(branch, payload):
        # Pi-hole v6's top_domains response nests the list under
        # "domains", NOT "top_domains" — confirmed against a live branch:
        # {"domains": [{"domain": ..., "count": ...}, ...], "total_queries": ...}
        entries = payload.get("domains", [])
        if not entries:
            return
        ts_ns = str(int(time.time() * 1e9))
        lines = [[ts_ns, json.dumps({"branch": branch, "domain": d["domain"], "count": d["count"]})] for d in entries]
        body = json.dumps({"streams": [{"stream": {"job": "pihole-domain-collector", "branch": branch}, "values": lines}]}).encode()
        req = urllib.request.Request(LOKI_PUSH_URL, data=body, headers={"Content-Type": "application/json"})
        urllib.request.urlopen(req, timeout=10)

    for branch, host in BRANCHES.items():
        try:
            sid = get_session_id(host)
            data = fetch_top_domains(host, sid)
            push_to_loki(branch, data)
            print(f"[ok] {branch}: pushed {len(data.get('domains', []))} domains")
        except Exception as e:
            print(f"[warn] {branch} ({host}) unreachable: {e}")
            traceback.print_exc()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pihole-domain-collector
  namespace: dns-monitoring
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pihole-domain-collector
        spec:
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: python:3.12-slim
              command: ["python", "/scripts/collect.py"]
              envFrom:
                - secretRef:
                    name: pihole-api-credentials
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: branches
                  mountPath: /config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: pihole-domain-collector-script
            - name: branches
              configMap:
                name: pihole-branch-hosts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-analytics-rollup-script
  namespace: dns-monitoring
data:
  rollup.py: |
    import os, json, time, urllib.request, urllib.parse
    from collections import defaultdict
    import psycopg2

    LOKI_QUERY_URL = os.environ.get(
        "LOKI_QUERY_URL",
        "http://dns-monitoring-loki.dns-monitoring.svc.cluster.local.:3100/loki/api/v1/query_range",
    )

    now = int(time.time())
    start = now - 24 * 3600
    params = urllib.parse.urlencode({
        "query": '{job="pihole-domain-collector"}',
        "start": str(start * 1_000_000_000),
        "end": str(now * 1_000_000_000),
        "limit": "5000",
    })
    with urllib.request.urlopen(f"{LOKI_QUERY_URL}?{params}", timeout=30) as resp:
        result = json.load(resp)

    totals = defaultdict(int)
    for stream in result.get("data", {}).get("result", []):
        for _, line in stream.get("values", []):
            rec = json.loads(line)
            totals[(rec["branch"], rec["domain"])] += rec["count"]

    conn = psycopg2.connect(
        host="postgres-rollup.dns-monitoring.svc.cluster.local.",
        dbname=os.environ["POSTGRES_DB"],
        user=os.environ["POSTGRES_USER"],
        password=os.environ["POSTGRES_PASSWORD"],
    )
    cur = conn.cursor()
    today = time.strftime("%Y-%m-%d")
    for (branch, domain), count in totals.items():
        cur.execute(
            """
            INSERT INTO top_domains_daily (day, branch, domain, query_count)
            VALUES (%s, %s, %s, %s)
            ON CONFLICT (day, branch, domain)
            DO UPDATE SET query_count = EXCLUDED.query_count
            """,
            (today, branch, domain, count),
        )
    conn.commit()
    print(f"[ok] wrote {len(totals)} (branch, domain) rows for {today}")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-analytics-rollup
  namespace: dns-monitoring
spec:
  # Runs shortly after midnight, giving the day's last collector runs time
  # to land in Loki before the aggregation query's 24h window closes.
  schedule: "20 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dns-analytics-rollup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rollup
              image: python:3.12-slim
              command: ["sh", "-c", "pip install --quiet psycopg2-binary && python /scripts/rollup.py"]
              envFrom:
                - secretRef:
                    name: postgres-rollup-credentials
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: dns-analytics-rollup-script

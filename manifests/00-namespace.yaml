# Deliberately a distinct namespace from any existing cluster-level
# monitoring you may already run, and separate from wherever SnipeIT lives.
apiVersion: v1
kind: Namespace
metadata:
  name: dns-monitoring
  labels:
    app.kubernetes.io/part-of: dns-monitoring-stack
---
# Caps total resource consumption for this namespace so it cannot starve
# SnipeIT (or anything else) on the same cluster if something misbehaves
# (e.g. a runaway Prometheus query, a Grafana memory leak).
#
# POC MODE: sums shrunk to match the single-pod, no-Postgres topology
# (1x Prometheus + 1x Alertmanager + 1x Grafana, each with its own PVC).
# When you scale back to HA, double these roughly in line with the
# replica counts you restore in values.yaml. Adjust either direction if
# `kubectl top pods -n dns-monitoring` shows it's tight or generous.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dns-monitoring-quota
  namespace: dns-monitoring
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "1Gi"
    limits.cpu: "1500m"
    limits.memory: "2Gi"
    requests.storage: "40Gi"
    persistentvolumeclaims: "4"
    pods: "6"
---
# Fallback requests/limits for any container in this namespace that doesn't
# specify its own — mainly a safety net, since values.yaml/postgres.yaml set
# explicit resources already.
apiVersion: v1
kind: LimitRange
metadata:
  name: dns-monitoring-limits
  namespace: dns-monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "2Gi"

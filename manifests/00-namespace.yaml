# UPDATED: quota raised now that a second node (same spec: 6 vCPU,
# ~7000Mi RAM) has been added to the cluster, giving this namespace real
# headroom instead of fighting a razor-thin ceiling shared with the
# Vault Agent Injector's per-pod init-container overhead.
#
# Why the previous ceiling kept getting hit: the injector's init
# container on postgres-rollup/metabase/the two CronJobs, PLUS an extra
# container on the Loki pod (2/2 Ready — the Loki chart runs more than
# just the single "loki" container even with gateway/caches disabled),
# meant real steady-state usage was already close to 1800m out of a
# 2000m limits.cpu ceiling before any CronJob burst ran at all. The
# rollup Job's own 300m + its 100m injector sidecar had nowhere to fit.
#
# New sizing rationale (deliberately generous, not razor-thin):
#   - Steady-state long-running pods (postgres-rollup, loki, metabase,
#     plus their injector init containers) currently observed around
#     1800m CPU / ~3.5-4Gi memory.
#   - Add room for BOTH CronJobs' burst pods to run concurrently without
#     blocking each other (collector 100m+100m injector, rollup
#     300m+100m injector = ~600m combined), plus a manual test job or
#     ad-hoc debug pod on top.
#   - Kept well under half of one node's total capacity (6 vCPU /
#     ~6.8Gi), since this cluster is shared with another application
#     (SnipeIT) and system pods (Cilium, CoreDNS, kube-proxy) also need
#     headroom on every node — this is NOT sized to consume a whole node.
#   - ttlSecondsAfterFinished: 300 (added separately, in
#     12-domain-collector-cronjob.yaml) still matters here — this quota
#     bump gives breathing room, it does not replace cleaning up
#     finished pods promptly.
#
# Namespace itself still intentionally not defined here — see the
# original file's comment on why (CreateNamespace=true handles it).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dns-monitoring-quota
  namespace: dns-monitoring
spec:
  hard:
    requests.cpu: "1200m"
    requests.memory: "2.5Gi"
    limits.cpu: "3000m"
    limits.memory: "6Gi"
    requests.storage: "30Gi"
    persistentvolumeclaims: "3"
    pods: "8"
---
# Fallback requests/limits for any container in this namespace that
# doesn't specify its own — unchanged; every component sets explicit
# resources already, so this remains a pure safety net.
apiVersion: v1
kind: LimitRange
metadata:
  name: dns-monitoring-limits
  namespace: dns-monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "2Gi"

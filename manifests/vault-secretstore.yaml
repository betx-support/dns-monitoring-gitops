# Mirrors vault-secretstore.yaml from the snipeit project exactly — one
# dedicated SecretStore per app namespace, pointing at that app's own
# Vault KV mount (see 06-dns-monitoring-kv-and-secrets.sh).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: dns-monitoring
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: dns-monitoring
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: dns-monitoring-eso
          serviceAccountRef:
            name: dns-monitoring-eso

# UPDATED — adds https://grafana.github.io/helm-charts as a permitted
# source repo, for the new dns-monitoring-loki Helm Application
# (argocd-application-loki.yaml). Everything else is unchanged from the
# original dns-monitoring-project.yaml; see that file's original comments
# for why clusterResourceWhitelist isn't empty here and why kube-system
# is a permitted destination.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dns-monitoring-project
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/betx-support/dns-monitoring-gitops.git
    # kube-prometheus-stack's Helm chart source.
    - https://prometheus-community.github.io/helm-charts
    # Loki's Helm chart source, added for the marketing-analytics addition.
    - https://grafana.github.io/helm-charts
  destinations:
    - namespace: dns-monitoring
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "apiextensions.k8s.io"
      kind: "CustomResourceDefinition"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRole"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRoleBinding"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

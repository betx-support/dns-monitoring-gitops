# UPDATED: Pipeline A (kube-prometheus-stack) removed. This trims the
# permissions that existed only for it:
#   - prometheus-community's Helm repo is no longer a needed source.
#   - The CRD/ClusterRole/ClusterRoleBinding cluster-resource whitelist
#     entries existed only for kube-prometheus-stack's Operator
#     (Prometheus/Alertmanager CRDs + its RBAC). Loki's chart
#     (deploymentMode: SingleBinary, filesystem storage) does not
#     register cluster-scoped resources of its own, so an empty
#     whitelist should be safe — but do a dry-run sync after applying
#     this before trusting it in case that assumption doesn't hold for
#     your specific chart version:
#       argocd app diff dns-monitoring-loki
#     If it complains about a missing permitted kind, add just that kind
#     back rather than restoring the full original list.
#   - kube-system was only a valid destination because kube-prometheus-
#     stack's kubelet service monitor targeted it (values.yaml's
#     `kubelet.namespace: dns-monitoring` override actually pointed this
#     back at dns-monitoring, so kube-system as a destination was likely
#     already unused — removing it here; add it back if anything else in
#     this project turns out to need it).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dns-monitoring-project
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/betx-support/dns-monitoring-gitops.git
    # Loki's Helm chart source — the only remaining external chart source.
    - https://grafana.github.io/helm-charts
  destinations:
    - namespace: dns-monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
